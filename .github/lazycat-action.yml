version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/kamifaka.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: kamifaka

build:
  run_buildscript: false

images:
  # 主应用：上游两段式 v 前缀家族（v1.3/v1.6/v1.65/v1.8），排除 v1.65（实为 1.6.5，按 \d+\.\d+ 映射会错排到 1.65.0）
  - id: kamifaka
    target: service
    service: kamifaka
    source: baiyuetribe/kamifaka
    channel: custom
    sort: semver
    tag_regex: '^v\d+\.\d+$'
    exclude_regex: '^v1\.65$'
    version_regex: '^v(?P<version>\d+\.\d+)$'
    version_template: '{version}.0'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: Kamifaka
    summary: "开源发卡系统"
